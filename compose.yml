services:
  app:
    build: .
    command: npm run dev -- --hostname 0.0.0.0
    ports:
      - "3000:3000"
    environment:
      DATABASE_PATH: /app/data/task-planner.sqlite
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - task_data:/app/data
volumes:
  node_modules:
  task_data:
